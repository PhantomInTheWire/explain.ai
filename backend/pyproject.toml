[project]
name = "vedanta-backend"
version = "2.0.0"
description = "Multi-user PDF to presentation and video pipeline"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=21.0.0",
    "redis>=5.0.0",
    "weaviate-client>=4.4.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "pdfplumber>=0.11.0",
    "python-pptx>=0.6.23",
    "langchain>=0.2.3",
    "langchain-community>=0.2.4",
    "langchain-google-genai>=1.0.6",
    "langchain-text-splitters>=0.2.1",
    "google-cloud-texttospeech>=2.16.3",
    "google-generativeai>=0.5.4",
    "moviepy>=1.0.3",
    "pypdfium2>=4.30.0",
    "pillow>=10.3.0",
    "convertapi>=1.8.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
